# Render Free Plan + Turso Cloud (libSQL) Persistent Database
# Add TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the Render Dashboard -> Environment.
services:
  - type: web
    name: panther-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
