services:
  - type: web
    name: panther-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: panther-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
