# ⚠️ FREE PLAN — No persistent disk.
# ⚠️ SQLite DB (data/mashwar.db) will RESET on every deploy.
# ⚠️ Upgrade to 'plan: starter' + add disk block after month 1 for production.
services:
  - type: web
    name: panther-app
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
