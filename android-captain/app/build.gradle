plugins {
    id 'com.android.application'
}

android {
    namespace 'sy.panther.captain'
    compileSdk 34

    defaultConfig {
        applicationId "sy.panther.captain"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.3.1"
    }

    signingConfigs {
        release {
            storeFile file("../release-key.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: { throw new GradleException("Missing required environment variable KEYSTORE_PASSWORD for APK signing") }()
            keyAlias System.getenv("KEY_ALIAS") ?: "panther"
            keyPassword System.getenv("KEY_PASSWORD") ?: { throw new GradleException("Missing required environment variable KEY_PASSWORD for APK signing") }()
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    flavorDimensions "role"
    productFlavors {
        captain {
            dimension "role"
            applicationId "sy.panther.captain"
            resValue "string", "app_name", "PANTHER كابتن"
            signingConfig signingConfigs.release
        }
        merchant {
            dimension "role"
            applicationId "sy.panther.merchant"
            resValue "string", "app_name", "PANTHER منشأة"
            signingConfig signingConfigs.release
        }
        admin {
            dimension "role"
            applicationId "sy.panther.admin"
            resValue "string", "app_name", "PANTHER إدارة"
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
